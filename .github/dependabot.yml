# Actualizaciones de dependencias (fase 8 · mantenimiento mensual). Cada propuesta llega como PR y pasa
# por la CI completa (auditoría, pruebas RLS y E2E) antes de que una persona decida fusionarla.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
